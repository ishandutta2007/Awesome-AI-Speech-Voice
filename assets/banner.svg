<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b14"/>
      <stop offset="50%" stop-color="#121324"/>
      <stop offset="100%" stop-color="#07080e"/>
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="glowCircle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes waveMove1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-35px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(0); }
      50% { transform: translateX(40px); }
      100% { transform: translateX(0); }
    }
    @keyframes eqBar1 { 0%, 100% { height: 18px; } 50% { height: 48px; } }
    @keyframes eqBar2 { 0%, 100% { height: 42px; } 50% { height: 14px; } }
    @keyframes eqBar3 { 0%, 100% { height: 28px; } 50% { height: 56px; } }
    @keyframes eqBar4 { 0%, 100% { height: 50px; } 50% { height: 22px; } }
    @keyframes eqBar5 { 0%, 100% { height: 22px; } 50% { height: 44px; } }

    .glow-bg {
      transform-origin: 600px 210px;
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .wave-line-1 {
      animation: waveMove1 6s ease-in-out infinite;
    }
    .wave-line-2 {
      animation: waveMove2 8s ease-in-out infinite;
    }
    .eq-1 { animation: eqBar1 1.4s ease-in-out infinite; }
    .eq-2 { animation: eqBar2 1.1s ease-in-out infinite; }
    .eq-3 { animation: eqBar3 1.7s ease-in-out infinite; }
    .eq-4 { animation: eqBar4 1.3s ease-in-out infinite; }
    .eq-5 { animation: eqBar5 1.5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e2238" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="600" cy="210" r="320" fill="url(#glowCircle)" class="glow-bg"/>
  <circle cx="200" cy="80" r="180" fill="url(#glowCircle)" opacity="0.15"/>
  <circle cx="1020" cy="340" r="220" fill="url(#glowCircle)" opacity="0.2"/>

  <!-- Decorative Background Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- Dynamic Waveform Lines in Background (Behind Text) -->
  <g fill="none" opacity="0.45" filter="url(#glowEffect)">
    <path class="wave-line-1" stroke="url(#waveGrad)" stroke-width="2.5"
      d="M -50 330 Q 150 260 350 340 T 750 320 T 1150 280 T 1300 320" />
    <path class="wave-line-2" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"
      d="M -50 345 Q 180 380 400 310 T 800 350 T 1180 320 T 1300 340" />
  </g>

  <!-- Top Category Pill Badge -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.95"/>
    <circle cx="-116" cy="0" r="4" fill="#38bdf8"/>
    <text x="-98" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Title (Foreground) -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#primaryTextGrad)" letter-spacing="-1">
    Awesome AI Speech &amp; Voice
  </text>

  <!-- Subtitle & Key Pillars (Foreground) -->
  <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
    Voice Cloning • Expressive TTS • Foundation ASR • Real-Time Voice Agents
  </text>

  <!-- Audio Equalizer Bars Visualizer (Centered below subtitle) -->
  <g transform="translate(600, 275)" fill="url(#waveGrad)">
    <rect class="eq-1" x="-48" y="-15" width="6" height="30" rx="3" />
    <rect class="eq-2" x="-36" y="-20" width="6" height="40" rx="3" />
    <rect class="eq-3" x="-24" y="-25" width="6" height="50" rx="3" />
    <rect class="eq-4" x="-12" y="-18" width="6" height="36" rx="3" />
    <rect class="eq-5" x="0" y="-28" width="6" height="56" rx="3" />
    <rect class="eq-2" x="12" y="-18" width="6" height="36" rx="3" />
    <rect class="eq-4" x="24" y="-25" width="6" height="50" rx="3" />
    <rect class="eq-1" x="36" y="-20" width="6" height="40" rx="3" />
    <rect class="eq-3" x="48" y="-15" width="6" height="30" rx="3" />
  </g>

  <!-- Feature Pills Footer -->
  <g transform="translate(600, 355)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
    <!-- Pill 1 -->
    <g transform="translate(-320, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#94a3b8">🎙️ Voice Cloning</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-110, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#94a3b8">⚡ 7.5 Hz Tokenizers</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(100, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#94a3b8">💻 Zero-GPU Edge</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(310, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#94a3b8">🛡️ Voice Watermarking</text>
    </g>
  </g>
</svg>
